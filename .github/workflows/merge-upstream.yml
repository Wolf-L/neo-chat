# Fork-only: merge u14app/neo-chat into this fork's main while keeping local
# customizations, then push. Cloudflare Workers Builds deploys every push to
# main, so a failed merge or failed checks leaves the live Worker unchanged.
name: Merge upstream

on:
  workflow_dispatch:
  schedule:
    - cron: "41 */6 * * *"

permissions:
  contents: write

concurrency:
  group: merge-upstream-${{ github.repository }}
  cancel-in-progress: false

jobs:
  merge:
    if: ${{ github.event.repository.fork == true }}
    runs-on: ubuntu-latest
    env:
      UPSTREAM_REPOSITORY: ${{ vars.UPSTREAM_REPOSITORY || 'u14app/neo-chat' }}
      UPSTREAM_BRANCH: ${{ vars.UPSTREAM_BRANCH || 'main' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Merge upstream
        id: merge
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898783+github-actions[bot]@users.noreply.github.com"
          # Files marked `merge=ours` in .gitattributes keep the fork's version.
          git config merge.ours.driver true

          git fetch --no-tags "https://github.com/${UPSTREAM_REPOSITORY}.git" "$UPSTREAM_BRANCH"
          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            echo "Already up to date with ${UPSTREAM_REPOSITORY}@${UPSTREAM_BRANCH}."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          upstream_sha="$(git rev-parse --short FETCH_HEAD)"
          if ! git merge --no-edit -m "chore: merge upstream ${UPSTREAM_REPOSITORY}@${upstream_sha}" FETCH_HEAD; then
            echo "::error::Merge conflict with upstream; resolve it manually."
            git diff --name-only --diff-filter=U
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        if: steps.merge.outputs.changed == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 10.30.3

      - name: Set up Node.js
        if: steps.merge.outputs.changed == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        if: steps.merge.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        if: steps.merge.outputs.changed == 'true'
        run: pnpm typecheck

      - name: Test
        if: steps.merge.outputs.changed == 'true'
        run: pnpm test

      - name: Push
        if: steps.merge.outputs.changed == 'true'
        run: git push origin "HEAD:${{ github.event.repository.default_branch }}"
